<!-- notes -->
<g font-size="13" fill="#222">
<text x="40" y="966" font-weight="bold">Réception : HCPL-0501 n°1, en service depuis novembre 2026 (confirmé)</text>
<text x="40" y="986">Repos (~11,5 V) : LED allumée, GPIO20 à 0. Bit à 0 (bus sous ~7,5 V) : LED éteinte, GPIO20 à 1. Signal inversé (RX inversée dans le firmware).</text>
<text x="40" y="1016" font-weight="bold">Émission : en service sur la PAC depuis le 23/11/2026 (confirmé)</text>
<text x="40" y="1036">TX = 1, ESP32 éteint ou en reset : LED n°2 éteinte, BC807 et BC817 bloqués, bus libre. TX = 0 : LED allumée, BC807 puis BC817 conduisent, bus tiré à 0.</text>
<text x="40" y="1056">Réserve BAR43 + 22 µF : alimente l'étage pendant les bits à 0. Pont MB10S : branchement de l'émission indifférent à la polarité.</text>
<text x="40" y="1076">SOT-23 : BC807 (PNP) et BC817 (NPN), brochage habituel 1 = base, 2 = émetteur, 3 = collecteur. BAR43 ou BAT54 sans suffixe (une seule diode).</text>
<text x="40" y="1096">Vérifier ces brochages sur la datasheet du fabricant commandé.</text>
</g>
<g font-size="13" fill="#993C1D" font-weight="bold">
<text x="40" y="1130">Jamais la masse d'un appareil relié à la terre (oscilloscope, PC, chargeur secteur) sur un fil du bus.</text>
<text x="40" y="1150">Essai sur table d'abord (alim 12 V + 300 Ω, sans la PAC) : niveau bas mesuré ~1,3-1,6 V, ~34 mA.</text>
</g>
</svg>
