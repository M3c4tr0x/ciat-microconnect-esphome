<text x="612" y="286" text-anchor="end" font-weight="bold" fill="#222">PNP BC807</text>
<text x="641" y="330">10 kΩ</text>
<text x="641" y="480">10 kΩ</text>
<text x="703" y="414" font-weight="bold" fill="#222">NPN</text><text x="703" y="430" font-weight="bold" fill="#222">BC817</text>
<text x="711" y="320">10 Ω</text>
<text x="781" y="372">100 nF</text>
<text x="841" y="372">22 µF</text><text x="841" y="386">25 V</text>
<text x="815" y="336" font-size="13" font-weight="bold">+</text>
<text x="878" y="98" font-weight="bold" fill="#222">BAR43</text><text x="878" y="113">(or BAT54)</text>
<text x="960" y="345" text-anchor="middle" font-weight="bold" font-size="13" fill="#222">MB10S</text>
<text x="960" y="362" text-anchor="middle">(2nd bridge)</text>
<text x="968" y="306">+</text><text x="968" y="404">−</text>
