<text x="1190" y="740" font-size="12" fill="#444" text-anchor="middle">any polarity</text>

<g font-size="13" fill="#222">
<text x="40" y="966" font-weight="bold">Receive: HCPL-0501 #1 — in service since Nov 2026 (confirmed)</text>
<text x="40" y="986">Idle (~11.5 V): LED on, GPIO20 low. 0 bit (bus below ~7.5 V): LED off, GPIO20 high. Signal inverted (RX inverted in firmware).</text>
<text x="40" y="1016" font-weight="bold">Transmit: in service on the heat pump since 23 Nov 2026 (confirmed)</text>
<text x="40" y="1036">TX = 1, ESP32 off or in reset: LED #2 off, BC807 and BC817 off, bus free. TX = 0: LED on, BC807 then BC817 conduct, bus pulled low.</text>
<text x="40" y="1056">BAR43 + 22 µF reservoir: powers the stage during 0 bits. MB10S bridge: the transmit stage works with either polarity.</text>
<text x="40" y="1076">SOT-23: BC807 (PNP) and BC817 (NPN), usual pinout 1 = base, 2 = emitter, 3 = collector. BAR43 or plain BAT54 (single diode).</text>
<text x="40" y="1096">Check the pinouts in the datasheet of the parts you buy.</text>
</g>
<g font-size="13" fill="#993C1D" font-weight="bold">
<text x="40" y="1130">Never connect the ground of an earthed device (oscilloscope, PC, mains charger) to a bus wire.</text>
<text x="40" y="1150">Bench-test first (12 V supply + 300 Ω, no heat pump): measured low level ~1.3-1.6 V, ~34 mA.</text>
</g>
</svg>
