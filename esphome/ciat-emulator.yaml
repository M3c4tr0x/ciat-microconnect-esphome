# Thermostats for Home Assistant. ESPHome "template" platform: HA requests are queued (globals) and applied by the
# navigator loop; the state shown always comes from the heat pump.
#   modes:    heat = dial on heating; off = dial on off;
#   presets:  comfort / eco = dial on heating + programme slot; away = dial on frost protection;
#   setpoint: adjusted outside the menu with + and −, dial on heating only, 15 to 30 °C by 0.5;
#   action:   heating while the compressor runs.
climate:
  - platform: template
    id: heating_climate
    name: Heating
    sensor: room_ha                # the room temperature sent to the heat pump
    supports_action: true
    supported_modes: [HEAT, "OFF"]
    supported_presets: [COMFORT, ECO, AWAY]
    optimistic: false              # the state only changes when the heat pump displays it
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 15
      max_temperature: 30
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    # A request that changes nothing (dial already in the right position) is not queued: it would interrupt a scan
    # for nothing (a scheduler may apply the same preset again).
    set_mode_action:
      - lambda: |-
          uint8_t wanted = (x == climate::CLIMATE_MODE_OFF) ? 4 : 6;
          auto im = id(sel_dial).active_index();
          if (!im.has_value() || *im + 1 != wanted) id(requested_dial) = wanted;
    set_preset_action:
      - lambda: |-
          if (x != climate::CLIMATE_PRESET_AWAY && x != climate::CLIMATE_PRESET_COMFORT && x != climate::CLIMATE_PRESET_ECO) return;
          uint8_t wanted = x == climate::CLIMATE_PRESET_AWAY ? 5 : 6;
          auto im = id(sel_dial).active_index();
          if (!im.has_value() || *im + 1 != wanted) id(requested_dial) = wanted;
          if (wanted == 6) {
            const char *slot = x == climate::CLIMATE_PRESET_COMFORT ? "comfort" : "eco";
            auto is = id(sel_slot).active_index();
            bool already = is.has_value() && (*is == 0) == (x == climate::CLIMATE_PRESET_COMFORT);
            if (!already) id(sel_slot).make_call().set_option(slot).perform();
          }
    set_target_temperature_action:
      - lambda: |-
          float v = std::round(x * 2.0f) / 2.0f;
          if (std::isnan(id(stable_setpoint)) || std::fabs(id(stable_setpoint) - v) > 0.05f) {
            id(requested_setpoint) = v;
            id(setpoint_dial) = 6;
          }

  # Pool (summer): heat = dial on pool, off = dial on off. The heat pump then heats only while the pool contact is
  # closed (wired by the installer, typically in series with the pool pump).
  # Pool setpoint adjusted outside the menu with + and −, assumed limits 20-35 (range of P23); temperature: P50.
  - platform: template
    id: pool_climate
    name: Pool
    sensor: p50
    supports_action: true
    supported_modes: [HEAT, "OFF"]
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 20
      max_temperature: 35
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    set_mode_action:
      - lambda: |-
          auto im = id(sel_dial).active_index();
          uint8_t m = im.has_value() ? *im + 1 : 0;
          if (x == climate::CLIMATE_MODE_HEAT) { if (m != 8) id(requested_dial) = 8; }
          else if (m == 8) id(requested_dial) = 4;   // pool off: dial on off
    set_target_temperature_action:
      - lambda: |-
          float v = std::round(x * 2.0f) / 2.0f;
          auto im = id(sel_dial).active_index();
          bool already = im.has_value() && *im + 1 == 8 && !std::isnan(id(stable_setpoint)) &&
                         std::fabs(id(stable_setpoint) - v) < 0.05f;
          if (!already) { id(requested_setpoint) = v; id(setpoint_dial) = 8; }

select:
  - platform: template
    id: sel_dial
    name: Virtual dial
    internal: true   # driven by the thermostats (Heating, Pool)
    options: [clock, cooling programme, cooling, "off", frost protection, heating, heating programme, pool]   # order = codes 1 to 8
    initial_option: frost protection
    optimistic: true
    restore_value: true
  - platform: template
    id: sel_slot
    name: Programme slot
    internal: true   # driven by the Heating thermostat
    options: [comfort, eco]   # used only when the heat pump is in programme mode (dial on heating)
    initial_option: eco
    optimistic: true
    restore_value: true

number:
  # Water flow rate of the heating circuit, for the thermal power: to be found (flow meter, circulator curve, heat
  # pump manual). 0 = thermal power disabled. Not measured by the heat pump.
  - platform: template
    id: nb_flow
    name: Water flow rate
    unit_of_measurement: "m³/h"
    min_value: 0
    max_value: 10
    step: 0.01
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: nb_scan_period
    name: Measurement scan period
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: nb_param
    name: Parameter to write
    min_value: 0
    max_value: 99
    step: 1
    initial_value: 0
    optimistic: true
    entity_category: config
  - platform: template
    id: nb_value
    name: Value to write
    min_value: -20
    max_value: 90
    step: 0.1
    initial_value: 0
    optimistic: true
    entity_category: config

button:
  # Low-level commands: only with "Rescue mode" on. The navigator refuses (error published) if transmission is off.
  - platform: template
    name: Scan the measurements
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          std::string err;
          if (!ciat::link::link().active()) err = "transmission inactive (shadow mode): scan refused";
          else {
            auto im = id(sel_dial).active_index();
            bool pool = im.has_value() && *im + 1 == 8;
            if (ciat::nav::navigator().scan(ciat::nav::fast_list(pool), err)) id(t_fast_scan) = millis();
          }
          if (!err.empty()) id(nav_error).publish_state(err);
  - platform: template
    name: Scan the settings
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          std::string err;
          if (!ciat::link::link().active()) err = "transmission inactive (shadow mode): scan refused";
          else if (ciat::nav::navigator().scan(ciat::nav::slow_list(), err)) {
            id(t_slow_scan) = millis();
            id(slow_scan_due) = false;
          }
          if (!err.empty()) id(nav_error).publish_state(err);
  - platform: template
    name: Write the parameter
    entity_category: config
    on_press:
      - lambda: |-
          std::string err;
          auto im = id(sel_dial).active_index();
          uint8_t m = im.has_value() ? *im + 1 : 0;
          if (!id(sw_rescue).state) err = "rescue mode off: write refused";
          else if (!ciat::link::link().active()) err = "transmission inactive (shadow mode): write refused";
          else if (!ciat::nav::dial_allows_menu(m)) err = "dial on a position without a menu";
          else ciat::nav::navigator().write((int) id(nb_param).state, id(nb_value).state, err);
          if (!err.empty()) id(nav_error).publish_state(err);
  - platform: template
    name: Reset the navigator
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::nav::navigator().reset();
  # Number of 12.1 frames carrying the key: 3 for + and − (outside the menu the heat pump takes no fewer; in the menu
  # it is still a single step), 2 for OK, 18 for a long press (menu entry and exit).
  - platform: template
    name: Key plus
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::link::link().press(0x01, 3);
  - platform: template
    name: Key minus
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::link::link().press(0x02, 3);
  - platform: template
    name: Key OK
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::link::link().press(0x04, 2);
  - platform: template
    name: Enter the parameter menu (long + and OK)
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::link::link().press(0x05, 18);
  - platform: template
    name: Long OK (leave the menu)
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(sw_rescue).state) { id(nav_error).publish_state("rescue mode off: command ignored"); ESP_LOGW("ciat", "rescue mode off: command ignored"); return; }
          ciat::link::link().press(0x04, 18);

switch:
  - platform: template
    id: sw_auto_scan
    name: Automatic scan
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: sw_rescue
    # Rescue mode: gives access to the low-level commands (keys, menu, parameter write, manual scans, navigator reset).
    # Off at boot, it turns itself off after 30 min.
    name: Rescue mode
    icon: mdi:lifebuoy
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(t_rescue) = millis();
  # Resumed at boot if it was on (see the resume interval). Turning it on again re-arms an inhibition.
  # No effect if tx_compiled = "false".
  - platform: template
    id: sw_tx
    name: Bus transmission
    entity_category: config
    # DISABLED: at boot ESPHome does not call turn_off_action (ALWAYS_OFF did, and cleared tx_wanted);
    # the resume is decided by the boot resume interval.
    restore_mode: DISABLED
    lambda: return ciat::link::link().active();
    turn_on_action:
      - lambda: |-
          if (!ciat::link::link().tx_compiled()) ESP_LOGW("ciat", "transmission not compiled: switch has no effect");
          id(tx_wanted) = true;
          ciat::link::link().allow(true);
    turn_off_action:
      - lambda: |-
          id(tx_wanted) = false;
          ciat::link::link().allow(false);
